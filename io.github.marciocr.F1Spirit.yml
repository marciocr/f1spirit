app-id: io.github.marciocr.F1Spirit
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: f1spirit

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: SDL3
    buildsystem: cmake-ninja
    config-opts:
      - -DSDL_SHARED=ON
      - -DSDL_STATIC=OFF
      - -DSDL_TEST_LIBRARY=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        tag: release-3.4.14

  - name: SDL3_image
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DSDLIMAGE_VENDORED=ON
      - -DSDLIMAGE_BMP=ON
      - -DSDLIMAGE_JPG=ON
      - -DSDLIMAGE_AVIF=OFF
      - -DSDLIMAGE_WEBP=OFF
      - -DSDLIMAGE_TIF=OFF
      - -DSDLIMAGE_PNG=ON
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL_image.git
        tag: release-3.4.4

  - name: SDL3_mixer
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DSDLMIXER_VENDORED=ON
      - -DSDLMIXER_EXAMPLES=OFF
      - -DSDLMIXER_TESTS=OFF
      - -DSDLMIXER_MP3=OFF
      - -DSDLMIXER_FLAC=OFF
      - -DSDLMIXER_MOD=OFF
      - -DSDLMIXER_MIDI=OFF
      - -DSDLMIXER_OPUS=OFF
      - -DSDLMIXER_WAVPACK=OFF
      - -DSDLMIXER_GME=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL_mixer.git
        tag: release-3.2.4

  - name: glm
    buildsystem: cmake-ninja
    config-opts:
      - -DGLM_BUILD_TESTS=OFF
      - -DBUILD_SHARED_LIBS=OFF
    sources:
      - type: git
        url: https://github.com/g-truc/glm.git
        tag: 1.0.3

  - name: f1spirit
    buildsystem: simple
    build-commands:
      - make clean
      - make
      - install -Dm755 f1spirit /app/bin/f1spirit.bin
      - install -d /app/bin/demos /app/bin/graphics /app/bin/tracks /app/bin/sound
      - cp -r demos/. /app/bin/demos/
      - cp -r graphics/. /app/bin/graphics/
      - cp -r tracks/. /app/bin/tracks/
      - cp -r sound/. /app/bin/sound/
      - install -Dm644 readme.txt /app/bin/readme.txt
      - install -Dm755 f1spirit-wrapper.sh /app/bin/f1spirit
      - install -Dm644 io.github.marciocr.F1Spirit.desktop /app/share/applications/io.github.marciocr.F1Spirit.desktop
      - install -Dm644 io.github.marciocr.F1Spirit.metainfo.xml /app/share/metainfo/io.github.marciocr.F1Spirit.metainfo.xml
      - install -Dm644 packaging/f1spirit-icon.png /app/share/icons/hicolor/50x50/apps/io.github.marciocr.F1Spirit.png
    sources:
      - type: dir
        path: .
      - type: script
        dest-filename: f1spirit-wrapper.sh
        commands:
          - "#!/bin/sh"
          - cd /app/bin
          - exec /app/bin/f1spirit.bin "$@"
